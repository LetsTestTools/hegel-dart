name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
        # Exclude generated FFI bindings from analysis
        continue-on-error: false

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14  # Apple Silicon
            platform_dir: macos_arm64
            lib_name: libhegel_c.dylib
          # Uncomment when binaries are available:
          # - os: ubuntu-latest
          #   platform_dir: linux_x64
          #   lib_name: libhegel_c.so
          # - os: windows-latest
          #   platform_dir: windows_x64
          #   lib_name: hegel_c.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Run tests
        env:
          HEGEL_LIBHEGEL_PATH: native/${{ matrix.platform_dir }}/${{ matrix.lib_name }}
        run: dart test

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart format --set-exit-if-changed lib/ test/ example/

  dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart pub publish --dry-run
