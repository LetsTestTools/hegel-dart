name: Fetch Native Binaries

# Fetches prebuilt libhegel release binaries and headers from hegeldev/hegel
# using tool/fetch_libhegel.sh, bundles them, and verifies native assets on
# macOS, Linux, and Windows.
on:
  workflow_dispatch:
    inputs:
      libhegel_version:
        description: 'libhegel version to fetch (e.g. 0.53.1). Defaults to native/.libhegel-version.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  fetch:
    name: Fetch libhegel binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ inputs.libhegel_version }}" ]; then
            VERSION="${{ inputs.libhegel_version }}"
          else
            VERSION=$(tr -d '[:space:]' < native/.libhegel-version)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch and verify libhegel assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tool/fetch_libhegel.sh "${{ steps.ver.outputs.version }}"

      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: native-all-platforms
          path: native/
          include-hidden-files: true

  verify:
    name: Verify (${{ matrix.os }})
    needs: fetch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Download native bundle
        uses: actions/download-artifact@v4
        with:
          name: native-all-platforms
          path: native/

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart test
