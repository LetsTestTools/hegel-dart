name: hegeltest
description: >-
  Property-based testing for Dart, powered by Hegel's native engine.
  Automatically finds edge cases by generating random inputs and
  shrinking failures to minimal counterexamples.
version: 0.1.0
repository: https://github.com/LetsTestTools/hegel-dart
homepage: https://hegel.dev

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  ffi: ^2.1.0
  meta: ^1.12.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
  ffigen: ^21.0.0
