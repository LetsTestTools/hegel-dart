name: hegeltest
description: >-
  Property-based testing for Dart, powered by Hegel's native engine.
  Automatically finds edge cases by generating random inputs and
  shrinking failures to minimal counterexamples.
version: 0.1.0
repository: https://github.com/brucearctor/hegel-dart
homepage: https://hegel.dev
issue_tracker: https://github.com/brucearctor/hegel-dart/issues

topics:
  - testing
  - property-based-testing
  - fuzzing
  - test-generation

environment:
  sdk: ">=3.4.0 <4.0.0"

platforms:
  macos:
  linux:
  windows:

dependencies:
  ffi: ^2.1.0
  meta: ^1.12.0
  test: ^1.25.0

dev_dependencies:
  lints: ^5.0.0
  ffigen: ^21.0.0
